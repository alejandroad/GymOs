packages:
  - "apps/*"
  - "packages/*"

# Dependencies allowed (true) or denied (false) to run install scripts.
# sharp and unrs-resolver ship prebuilt binaries, so their scripts aren't needed.
allowBuilds:
  sharp: false
  unrs-resolver: false

patchedDependencies:
  '@sqlite.org/sqlite-wasm@3.54.1-build1': patches/@sqlite.org__sqlite-wasm@3.54.1-build1.patch
